<!DOCTYPE html>
<html>
<head>
    <title>Catch The Star</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>⭐ Catch The Star ⭐</h1>

        <h3 id="status">Game Ready!</h3>

      <div class="game-info">

    <div class="box">
        Score
        <h2 id="score">0</h2>
    </div>

    <div class="box">
        Time
        <h2 id="time">30</h2>
    </div>

    <div class="box">
        Level
        <h2 id="level">1</h2>
    </div>

    <div class="box">
        High Score
        <h2 id="highScore">0</h2>
    </div>

</div>
<p class="instructions">
  Click the star or press SPACE to catch it!
  Use P to pause and M to mute.
</p>

<button onclick="toggleSound()" id="soundBtn">
  🔊 Sound ON
</button>

        <div id="game-area">
            <div id="star"
     tabindex="0"
     role="button"
     aria-label="Catch the star">⭐</div>
        </div>

        <button onclick="startGame()">Start</button>
        <button onclick="pauseGame()">Pause</button>
        <button onclick="resumeGame()">Resume</button>
        <button onclick="restartGame()">Restart</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
